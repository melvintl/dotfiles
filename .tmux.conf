# ~/.tmux.conf — plain tmux, no framework. Requires tmux >= 3.2.
#
# Replaced oh-my-tmux (gpakosz/.tmux, 2020 vintage) in Sep 2026: the handful of
# bindings and the One Dark status line it provided are reproduced here in
# native tmux, without the shell/awk theme engine and its startup cost.

# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"     # true colour
set-environment -g COLORTERM truecolor

# Extended keys + passthrough so TUI agents (Claude Code, pi) get Shift+Enter,
# modifier combos and OSC sequences through tmux. `always` (not `on`) also
# requests the mode from the outer terminal (iTerm2, Ghostty).
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

set -s escape-time 10           # faster command sequences
set -sg repeat-time 600         # longer window for -r (repeatable) bindings
set -s focus-events on          # nvim autoread etc.

set -g prefix2 C-a              # C-a alongside C-b (GNU screen habit)
bind C-a send-prefix -2

set -g history-limit 50000      # agent output is long
set -g mouse on
set -g set-clipboard on         # accept OSC 52 writes from apps -> outer clipboard
setw -g mode-keys vi            # vi keys in copy mode (see copy mode section)
set -g status-keys emacs        # prompt (prefix :) keeps emacs keys so Escape cancels

bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced"
bind E new-window -n "~/.tmux.conf" \
  "\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display '~/.tmux.conf sourced'"

# -- display -------------------------------------------------------------------

set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes too
setw -g automatic-rename on     # window name follows the running program
set -g renumber-windows on      # close a gap, renumber
set -g set-titles on            # terminal window title
set -g set-titles-string "#h ❐ #S ● #I #W"

set -g display-panes-time 800   # prefix q indicator
set -g display-time 1000        # status messages
set -g status-interval 10       # status line refresh (drives the loadavg #())

set -g monitor-activity on
set -g visual-activity off

# -- theme: One Dark -----------------------------------------------------------

bg="#282c34"        # onedark background
bg_alt="#3e4451"    # pane borders
fg_dim="#8a8a8a"    # inactive text
fg="#abb2bf"        # onedark foreground
yellow="#e5c07b"    # accent
black="#080808"

set -g status-style "fg=$fg_dim,bg=$bg"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=$black,bg=$yellow,bold] ❐ #S #[default] "
# indicators: prefix pressed / >1 client attached / panes synchronized,
# then 1-minute load and host. Add #(whoami) here if you want the user shown.
set -g status-right "#{?client_prefix,⌨ ,}#{?session_many_attached,👓 ,}#{?pane_synchronized,🔒 ,}#(uptime | sed 's/.*load averages*: *//' | cut -d' ' -f1 | tr -d ',') │ #h "

setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=$bg,bg=$fg,bold] #I #W "
setw -g window-status-activity-style "underscore"
setw -g window-status-bell-style "fg=$yellow,blink,bold"
setw -g window-status-last-style "fg=$fg"

set -g pane-border-style "fg=$bg_alt"
set -g pane-active-border-style "fg=$fg"
set -g display-panes-colour "$fg"
set -g display-panes-active-colour "$fg"

set -g message-style "fg=$bg,bg=$yellow,bold"          # prompts / messages
set -g message-command-style "fg=$yellow,bg=$bg,bold"  # prefix : in vi command mode
# tmux 3.7 draws the prompt on top of the status line and only paints the
# message text unless the style also has a fill colour; older tmux rejects fill
if-shell -F '#{>=:#{version},3.7}' \
  'set -ga message-style "fill=$yellow" ; set -ga message-command-style "fill=$bg"'
set -g mode-style "fg=$bg,bg=$yellow,bold"             # copy-mode selection
set -g clock-mode-colour "$fg"
set -g clock-mode-style 24

# popups (display-popup) share the accent colour of the status line
set -g popup-border-lines rounded
set -g popup-border-style "fg=$yellow"

# -- navigation ----------------------------------------------------------------

bind C-c new-session
bind BTab switch-client -l      # last session

# splits keep the pane's path; new windows start at the session path
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# j and J are taken by the session and claude pickers (see popups); C-j moves
# down, and resizing down has no prefix key.
bind -r h select-pane -L
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind + resize-pane -Z           # toggle zoom (oh-my-tmux "maximize")

bind -r H resize-pane -L 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind 0 select-window -t :=10
bind -r C-S-h swap-window -t -1 \; select-window -t -1   # move window left
bind -r C-S-l swap-window -t +1 \; select-window -t +1   # move window right

bind m set -gF mouse "#{?mouse,off,on}" \; display "mouse #{?mouse,on,off}"

# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer
# copy the top buffer to the OS clipboard by hand (fallback when OSC 52 is blocked)
if-shell 'command -v pbcopy' 'bind y run -b "tmux save-buffer - | pbcopy"'
if-shell 'command -v xsel'   'bind y run -b "tmux save-buffer - | xsel -i -b"'
if-shell 'command -v wl-copy' 'bind y run -b "tmux save-buffer - | wl-copy"'

# -- smart-splits --------------------------------------------------------------
# Seamless C-h/j/k/l between Neovim splits and tmux panes. smart-splits.nvim
# sets the @pane-is-vim user option on the pane while Neovim has focus, so
# this is a format check rather than a `ps` + grep per keypress (the old
# vim-tmux-navigator approach).
# See: https://github.com/mrjones2014/smart-splits.nvim

bind -n C-h  if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind -n C-j  if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind -n C-k  if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind -n C-l  if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'
bind -n 'C-\' if -F "#{@pane-is-vim}" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h  select-pane -L
bind -T copy-mode-vi C-j  select-pane -D
bind -T copy-mode-vi C-k  select-pane -U
bind -T copy-mode-vi C-l  select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# -- popups --------------------------------------------------------------------

# Fuzzy session switcher: live sessions first, then zoxide dirs; picking a dir
# switches to (or creates) a session named after it.
bind j display-popup -E -w 60% -h 50% 'sh -lc ''. "$HOME/.dotfiles.env" 2>/dev/null || true; DOTFILES_DIR=${DOTFILES_DIR:-$(dirname "$(readlink "$HOME/.tmux.conf")")}; exec "$DOTFILES_DIR/bin/tmux-jump"'''

# Jump to / resume a claude code session (fzf picker over `claude agents --json`)
bind J display-popup -E -w 80% -h 60% 'sh -lc ''. "$HOME/.dotfiles.env" 2>/dev/null || true; DOTFILES_DIR=${DOTFILES_DIR:-$(dirname "$(readlink "$HOME/.tmux.conf")")}; exec "$DOTFILES_DIR/bin/claude-jump"'''

# Workmux dashboard (TUI overview of all active agents)
bind a display-popup -E -w 90% -h 70% "workmux dashboard"

# lazygit overlay in the current pane's repo
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Scratch terminal: a plain shell in the current pane's directory, no nested
# tmux. Throwaway: exit / C-d closes the popup and the shell with it.
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# extrakto: fzf popup over the pane's visible text and scrollback (paths, URLs,
# SHAs, lines). Enter copies, Tab inserts at the prompt. Its default key is
# prefix+Tab, which last-window already uses.
set -g @extrakto_key e
set -g @extrakto_split_direction p
set -g @extrakto_popup_size "80%,60%"
if-shell 'test -f ~/.tmux/plugins/extrakto/extrakto.tmux' \
  'run-shell ~/.tmux/plugins/extrakto/extrakto.tmux'

# floax: persistent floating terminal. Unlike the prefix+t scratch popup, its
# shell lives in a hidden "floax" session and survives toggling. prefix+f
# toggles it (in place of find-window); prefix+F opens its resize/fullscreen/
# embed menu. Its defaults, p/P, are taken by paste-buffer and choose-buffer.
# The session name must not collide with a real session: floax types keys into
# that session's active pane. change-path is off because it follows the caller's
# directory by sending ` cd "<dir>"` + Enter as keystrokes to whatever is running
# in the float (a server, a TUI, an agent), not just to an idle shell.
set -g @floax-bind f
set -g @floax-session-name floax
set -g @floax-change-path false
set -g @floax-bind-menu F
set -g @floax-width 80%
set -g @floax-height 80%
set -g @floax-border-color "$yellow"
set -g @floax-text-color "$yellow"
if-shell 'test -f ~/.tmux/plugins/tmux-floax/floax.tmux' \
  'run-shell ~/.tmux/plugins/tmux-floax/floax.tmux'
