name: check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  STYLUA_VERSION: v2.4.0

jobs:
  dotfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh lua5.4 shellcheck

      - name: Install stylua
        run: |
          curl -fsSL -o /tmp/stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          sudo unzip -o -d /usr/local/bin /tmp/stylua.zip
          stylua --version

      # nvim/ needs Neovim 0.12+; Ubuntu's apt package is far older.
      # Extracted straight into $HOME: /tmp and $HOME can be on different filesystems.
      - name: Install Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C "$HOME"
          echo "$HOME/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$HOME/nvim-linux-x86_64/bin/nvim" --version | head -1

      - name: Run dotfiles health checks
        run: make check-smoke
